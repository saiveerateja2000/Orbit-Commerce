#
#  Generate a real value with:
#    echo -n 'your-real-secret' | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: orbit-commerce-secrets
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: orbit-commerce
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Replace with: echo -n 'your-secret-key' | base64
  SECRET_KEY: cmVwbGFjZS13aXRoLXJlYWwtc2VjcmV0LWtleQ==

  # Replace with: echo -n 'your-postgres-password' | base64
  POSTGRES_PASSWORD: cmVwbGFjZS13aXRoLXJlYWwtcG9zdGdyZXMtcGFzcw==

  # Replace with: echo -n 'your-admin-key' | base64
  ADMIN_KEY: cmVwbGFjZS13aXRoLXJlYWwtYWRtaW4ta2V5
