# ============================================================
#  OrbitCommerce – NGINX API Gateway  (port 80)
# ============================================================

# ── ConfigMap (nginx.conf) ────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: gateway
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid       /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        tcp_nopush      on;
        keepalive_timeout 65;
        server_tokens   off;

        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;
        limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

        upstream user_service {
            server user-service.orbit-commerce.svc.cluster.local:8001;
            keepalive 32;
        }
        upstream product_service {
            server product-service.orbit-commerce.svc.cluster.local:8002;
            keepalive 32;
        }
        upstream order_service {
            server order-service.orbit-commerce.svc.cluster.local:8003;
            keepalive 32;
        }
        upstream payment_service {
            server payment-service.orbit-commerce.svc.cluster.local:8004;
            keepalive 32;
        }
        upstream notification_service {
            server notification-service.orbit-commerce.svc.cluster.local:8005;
            keepalive 32;
        }
        upstream frontend_service {
            server frontend.orbit-commerce.svc.cluster.local:3000;
            keepalive 16;
        }

        server {
            listen 80;
            server_name _;

            access_log /var/log/nginx/access.log combined;
            error_log  /var/log/nginx/error.log warn;

            add_header X-Frame-Options        "SAMEORIGIN"   always;
            add_header X-Content-Type-Options "nosniff"      always;
            add_header X-XSS-Protection       "1; mode=block" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            set $cors_origin "";
            if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
                set $cors_origin $http_origin;
            }
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           "86400" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            limit_conn conn_limit 50;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_http_version    1.1;
            proxy_set_header      Connection "";

            location = /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "healthy\n";
            }

            location /api/users/ {
                limit_req zone=auth_limit burst=40 nodelay;
                proxy_pass       http://user_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
            }

            location /api/products/ {
                limit_req zone=api_limit burst=200 nodelay;
                proxy_pass       http://product_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
            }

            location /api/orders/ {
                limit_req zone=api_limit burst=100 nodelay;
                proxy_pass       http://order_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
            }

            location /api/payments/ {
                limit_req zone=auth_limit burst=40 nodelay;
                proxy_pass       http://payment_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
            }

            location /api/notifications/ {
                limit_req zone=api_limit burst=100 nodelay;
                proxy_pass       http://notification_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
            }

            location / {
                limit_req zone=api_limit burst=200 nodelay;
                proxy_pass       http://frontend_service/;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID      $request_id;
                proxy_intercept_errors off;
            }

            error_page 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
                internal;
            }
        }
    }

---
# ── Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/name: nginx
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
# ── Service (LoadBalancer) ────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
