apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-commerce-config
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: orbit-commerce
    app.kubernetes.io/component: config
data:
  POSTGRES_HOST: "postgres.orbit-commerce.svc.cluster.local"
  POSTGRES_USER: "orbit"
  POSTGRES_PORT: "5432"

  # OpenTelemetry collector endpoint (Jaeger gRPC receiver)
  OTLP_ENDPOINT: "http://jaeger.orbit-commerce.svc.cluster.local:4317"

  LOG_LEVEL: "info"

  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_MINUTES: "60"

  # Inter-service URLs (used by order-service and payment-service)
  USER_SERVICE_URL: "http://user-service.orbit-commerce.svc.cluster.local:8001"
  PRODUCT_SERVICE_URL: "http://product-service.orbit-commerce.svc.cluster.local:8002"
  ORDER_SERVICE_URL: "http://order-service.orbit-commerce.svc.cluster.local:8003"
  PAYMENT_SERVICE_URL: "http://payment-service.orbit-commerce.svc.cluster.local:8004"
  NOTIFICATION_SERVICE_URL: "http://notification-service.orbit-commerce.svc.cluster.local:8005"
