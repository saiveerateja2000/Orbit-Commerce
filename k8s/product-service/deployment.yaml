# ============================================================
#  OrbitCommerce – Product Service  (port 8002)
# ============================================================

# ── ConfigMap ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
data:
  PORT: "8002"
  LOG_LEVEL: "info"
  OTLP_ENDPOINT: "http://jaeger.orbit-commerce.svc.cluster.local:4317"

---
# ── Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/name: product-service
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-service
          image: orbit-commerce/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-commerce-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://orbit:$(POSTGRES_PASSWORD)@postgres.orbit-commerce.svc.cluster.local:5432/product_db"
          envFrom:
            - configMapRef:
                name: orbit-commerce-config
            - secretRef:
                name: orbit-commerce-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
# ── Service ───────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: orbit-commerce
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
