# OrbitCommerce NGINX API Gateway Configuration

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
include       /etc/nginx/mime.types;
default_type  application/octet-stream;

sendfile        on;
tcp_nopush      on;
keepalive_timeout 65;
server_tokens   off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream user_service {
    server user-service:8001;
    keepalive 32;
}

upstream product_service {
    server product-service:8002;
    keepalive 32;
}

upstream order_service {
    server order-service:8003;
    keepalive 32;
}

upstream payment_service {
    server payment-service:8004;
    keepalive 32;
}

upstream notification_service {
    server notification-service:8005;
    keepalive 32;
}

upstream frontend_service {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Access and error logs
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header X-XSS-Protection      "1; mode=block"         always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # CORS headers (preflight + all responses)
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-Request-ID" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age           "86400" always;

    # Handle CORS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Connection limit per IP
    limit_conn conn_limit 50;

    # Proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Common proxy headers macro (repeated per location for clarity)
    proxy_http_version 1.1;
    proxy_set_header Connection        "";

    # ----------------------------------------------------------------
    # Health check endpoint (used by load balancers / orchestrators)
    # ----------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ----------------------------------------------------------------
    # User Service  →  /api/users/*
    # ----------------------------------------------------------------
    location /api/users/ {
        limit_req zone=auth_limit burst=40 nodelay;

        proxy_pass         http://user_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ----------------------------------------------------------------
    # Product Service  →  /api/products/*
    # ----------------------------------------------------------------
    location /api/products/ {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass         http://product_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ----------------------------------------------------------------
    # Order Service  →  /api/orders/*
    # ----------------------------------------------------------------
    location /api/orders/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass         http://order_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ----------------------------------------------------------------
    # Payment Service  →  /api/payments/*
    # ----------------------------------------------------------------
    location /api/payments/ {
        limit_req zone=auth_limit burst=40 nodelay;

        proxy_pass         http://payment_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ----------------------------------------------------------------
    # Notification Service  →  /api/notifications/*
    # ----------------------------------------------------------------
    location /api/notifications/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass         http://notification_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ----------------------------------------------------------------
    # Frontend React App  →  /* (catch-all)
    # ----------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass         http://frontend_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        # Support client-side routing (SPA fallback handled by frontend nginx)
        proxy_intercept_errors off;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

} # end http
