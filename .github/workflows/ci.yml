name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write       # needed for ghcr.io pushes on main
  security-events: write  # needed for Trivy SARIF upload

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ matrix.service }}-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-${{ matrix.service }}-
            ${{ runner.os }}-pip-lint-

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        working-directory: services/${{ matrix.service }}
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --statistics

  # ── 2. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            db_name: user_db
            port: 8001
          - service: product-service
            db_name: product_db
            port: 8002
          - service: order-service
            db_name: order_db
            port: 8003
          - service: payment-service
            db_name: payment_db
            port: 8004
          - service: notification-service
            db_name: notification_db
            port: 8005

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ${{ matrix.db_name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://orbit:testpassword@localhost:5432/${{ matrix.db_name }}
      SECRET_KEY: ci-test-secret-key-not-for-production
      ADMIN_KEY: ci-test-admin-key
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: "60"
      OTLP_ENDPOINT: ""
      LOG_LEVEL: debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.service }}-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.service }}-
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Create test-results directory
        working-directory: services/${{ matrix.service }}
        run: mkdir -p test-results

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test-results/${{ matrix.service }}.xml \
            --cov=app \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=term-missing \
            || true   # do not fail the job if there are no tests yet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results/
          retention-days: 30

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker image (${{ matrix.context }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: services/user-service
            image: user-service
          - context: services/product-service
            image: product-service
          - context: services/order-service
            image: order-service
          - context: services/payment-service
            image: payment-service
          - context: services/notification-service
            image: notification-service
          - context: frontend
            image: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ── 4. Security scan ─────────────────────────────────────────────────────────
  security-scan:
    name: Security scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally so Trivy can scan it (even on PRs where we don't push)
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: >-
            ${{ startsWith(matrix.image, 'frontend') && 'frontend' || format('services/{0}', matrix.image) }}
          push: false
          load: true
          tags: scan-target/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target/${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'   # report but do not fail the build

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 30
